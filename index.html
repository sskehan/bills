<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyMint</title>
<meta name="theme-color" content="#312E81">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app — indigo header band, scrolling content, bottom tab bar with an amber add button; coin record, editor and filters open as full-screen sheets */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF0F6; --line:#E3E6EE; --ink:#111827; --ink-2:#374151; --ink-3:#4B5563;
  --indigo:#312E81; --indigo-2:#3D3A93; --primary:#4338CA; --primary-soft:#EEF2FF; --on-indigo:#C7D2FE;
  --amber:#F59E0B; --amber-soft:#FFF4DB; --amber-ink:#92400E;
  --mine:#15803D; --mine-soft:#ECFDF3; --ref:#334155; --warn:#B45309; --bad:#B91C1C;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--indigo)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
.m0{margin:0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.warnTxt{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--indigo);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:40px;height:40px;border-radius:11px;flex:none}
.brand{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;line-height:1.15}
.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:0;color:var(--on-indigo)}
.brand small.warnTxt{color:#FCD34D}
.hbtn{width:44px;height:44px;border-radius:12px;border:1px solid #4F4BA8;background:var(--indigo-2);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.hbtn .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#111827;font-size:11px;font-weight:800;line-height:18px;padding:0 5px}

/* buttons, chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:inherit;font-size:14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#111827}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px;white-space:nowrap;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:5px;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.x{background:var(--primary-soft);border-color:#C7D2FE;color:var(--primary)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.seg{display:flex;padding:4px;border-radius:14px;background:#E6E8F2}
.seg button{flex:1;min-height:38px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:700}
.seg.light button[aria-pressed="true"]{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* collection screen */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:14px;display:flex;flex-direction:column;gap:14px}
.hero{background:var(--indigo);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 18px;display:flex;flex-direction:column;gap:12px;margin-top:-14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#fff;border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;min-width:0;border:0;text-align:left;cursor:pointer}
.stat b{font-size:20px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;font-weight:600;color:var(--ink-3)}
.searchbar{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 6px 0 14px;border-radius:14px;background:#fff}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;padding:10px 0}
.searchbar .clear{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);cursor:pointer;font-size:16px;color:var(--ink-2)}
.tools{display:flex;gap:8px;align-items:center}
.tools .seg{flex:1}
.fbtn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.fbtn b{background:var(--primary);color:#fff;border-radius:9px;min-width:20px;height:20px;font-size:12px;line-height:20px;text-align:center;padding:0 5px}
.metarow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.metarow select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;min-height:38px;font-size:13px;font-weight:600}
.count{font-size:13px;font-weight:700;color:var(--ink-2)}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ghead h2{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.gico{width:28px;height:28px;border-radius:9px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.gcount{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px 10px;border-radius:16px;border:0;cursor:pointer;text-align:center;color:var(--ink);min-width:0}
.tile .face{width:var(--face,66px);height:var(--face,66px)}
.tile .yr{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .nm{display:flex;flex-direction:column;gap:2px;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}.tile .nm b{font-size:12.5px;font-weight:700;color:var(--ink)}.tile .nm small{font-size:10.5px;color:var(--ink-3)}
.tile .qty{position:absolute;top:8px;left:8px;background:#111827;color:#fff;border-radius:7px;font-size:10px;font-weight:800;padding:1px 6px}
.reftag{position:absolute;top:8px;right:8px;background:var(--ref);color:#fff;border-radius:5px;font-size:10px;font-weight:800;padding:1px 5px;letter-spacing:.04em}
.tiles.s{--cols:4;--face:54px}.tiles.s .nm{display:none}.tiles.s .tile{padding:10px 4px 8px}
.tiles.l{--cols:2;--face:110px}
.grade{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:800;white-space:nowrap}
.listbox{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:68px;border:0;border-bottom:1px solid #EEF0F5;background:transparent;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.lrow:last-child{border-bottom:0}
.lrow .face{--face:46px;width:46px;height:46px;flex:none}
.lrow .tx{flex:1;min-width:0}
.lrow .t1{display:block;font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.lrow .t2{display:block;font-size:12px;color:var(--ink-3);line-height:1.3;overflow-wrap:anywhere}
.lrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2)}

/* coin face (photo or drawn coin) */
.face{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.face img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 3px 8px rgba(17,24,39,.2);background:#fff}
.face.sq img{border-radius:14%}
.coin{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--face,66px)*.24);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),inset 0 -3px 6px rgba(0,0,0,.18),0 4px 10px rgba(17,24,39,.18)}
.m-gold{background:radial-gradient(circle at 35% 30%,#F7E6A6,#C9A13E 60%,#8F6E1C);color:#3D2C06}
.m-silver{background:radial-gradient(circle at 35% 30%,#F5F7F9,#BCC3CB 60%,#8E959E);color:#2F353C}
.m-copper{background:radial-gradient(circle at 35% 30%,#F2BC94,#B8693A 60%,#7E3F1C);color:#3A1C0B}
.dodeca{border-radius:0;box-shadow:none;clip-path:polygon(98.3% 62.9%,85.4% 85.4%,62.9% 98.3%,37.1% 98.3%,14.6% 85.4%,1.7% 62.9%,1.7% 37.1%,14.6% 14.6%,37.1% 1.7%,62.9% 1.7%,85.4% 14.6%,98.3% 37.1%)}
.heptagon{border-radius:0;box-shadow:none;clip-path:polygon(50% 0%,90% 20%,100% 60%,75% 100%,25% 100%,0% 60%,10% 20%)}

/* empty + banners */
.empty{border:2px dashed #C7CCDA;border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-2);background:#fff;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-size:19px;color:var(--ink)}
.banner{border:1px solid #FCD34D;background:var(--amber-soft);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner span{flex:1;min-width:180px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;min-height:60px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--primary);font-weight:800}
nav.tabs .addb{justify-self:center;width:56px;height:56px;min-height:0;border-radius:28px;background:var(--amber);color:#111827;box-shadow:0 6px 14px rgba(245,158,11,.4);padding:0;justify-content:center;margin-top:-10px}
nav.tabs .addb svg{width:26px;height:26px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--amber);color:#111827;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-weight:800}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:3;background:var(--indigo);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.shead .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.shead h2{flex:1;min-width:0;font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .btn{background:transparent;border-color:#6C68C2;color:#fff}
.shead .btn.amber{background:var(--amber);border-color:var(--amber);color:#111827}
.shead .btn.light{background:#fff;border-color:#fff;color:var(--indigo)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px;border:0;background:transparent;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.sbody{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.dhero{background:var(--indigo);color:#fff;padding:0 0 18px}
.dhero .wrap{display:flex;flex-direction:column;gap:6px}
.dhero h1{font-size:25px;font-weight:800;line-height:1.2;color:#fff}
.dhero .sub{font-size:13px;color:var(--on-indigo)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
.card{background:#fff;border-radius:18px;padding:6px 16px;box-shadow:0 1px 3px rgba(17,24,39,.06);min-width:0}
.card>h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;padding:12px 0 6px}
.card>h3 .sp{flex:1}
.ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ico svg{width:16px;height:16px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid #EEF0F5;font-size:14px}
.kv>span:first-child{color:var(--ink-3);flex:none;max-width:45%}
.kv>span:last-child{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.story{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink-2);padding:2px 0 14px;margin:0}
.todo{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border-radius:14px;padding:10px 12px;font-size:13px}
.todo>span:not(.ico){flex:1}
.nsbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px -8px 10px;padding:8px 10px;border-radius:12px;background:#DDF5F2;font-size:12px;font-weight:600;color:#115E59}
.nsbar a{color:#115E59}

/* photo viewer */
.stage{position:relative;height:290px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface-2)}
.stage img{max-height:100%;max-width:100%;object-fit:contain;cursor:zoom-in}
.stage.mine{background:#DDF5F2;border:3px solid var(--mine)}
.stage.ref{background:var(--surface-2);border:1px solid #C3C8D2}
.mybadge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--mine);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em}
.refbanner{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;background:rgba(51,65,85,.94);color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
.sidetag{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:8px;background:rgba(51,65,85,.9);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}
.coverbtn{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:18px;border:0;background:#fff;font-size:12px;font-weight:800;cursor:pointer;color:#111827}
.coverbtn[aria-pressed="true"]{background:var(--amber)}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px}
.th{position:relative;flex:none}
.th>button{width:66px;height:66px;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;display:block;background:var(--surface-2);position:relative}
.th>button img{width:100%;height:100%;object-fit:cover;display:block}
.th.mine>button{border:3px solid var(--mine)}
.th.ref>button{border:1px solid #C3C8D2}
.th.sel>button{outline:2px solid var(--indigo);outline-offset:2px}
.th .rb{position:absolute;left:0;right:0;bottom:0;background:rgba(51,65,85,.94);color:#fff;font-size:9px;font-weight:800;text-align:center;padding:1px 0}
.th .star{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:11px;background:var(--amber);display:flex;align-items:center;justify-content:center}
.addph{width:66px;height:66px;flex:none;border-radius:12px;border:2px dashed #818CF8;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer}
#zoom{position:fixed;inset:0;z-index:80;background:rgba(10,12,20,.95);display:flex;align-items:center;justify-content:center;padding:16px}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}

/* forms */
.fsec{background:#fff;border-radius:18px;padding:14px 16px 16px;box-shadow:0 1px 3px rgba(17,24,39,.06);display:flex;flex-direction:column;gap:12px}
.fsec>h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
details.fsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;min-height:34px}
details.fsec>summary::-webkit-details-marker{display:none}
details.fsec>summary .sp{flex:1}
details.fsec>summary .hint{font-size:12px;font-weight:600;color:var(--ink-3)}
details.fsec>summary::after{content:"▾";color:var(--ink-3);transition:transform .15s}
details.fsec[open]>summary::after{transform:rotate(180deg)}
details.fsec[open]>summary{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.inp,.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid #D1D5DE;background:#fff;border-radius:12px;padding:10px 12px;min-height:46px;width:100%;min-width:0;font-size:16px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.inrow{display:flex;gap:8px}
.inrow>*{min-width:0}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{min-height:40px;padding:0 13px;border-radius:12px;border:1px solid #D1D5DE;background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.pick.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pick.scroll::-webkit-scrollbar{display:none}
.stepper{display:flex;align-items:center;gap:0;border:1px solid #D1D5DE;border-radius:12px;overflow:hidden;width:max-content}
.stepper button{width:46px;height:44px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;cursor:pointer}
.stepper input{width:56px;height:46px;border:0;text-align:center;font-size:17px;font-weight:800;min-height:0;padding:0;border-radius:0}
.check-inline{display:flex;gap:10px;align-items:center;font-size:14px;margin:0;cursor:pointer}
.check-inline input{width:22px;height:22px;flex:none;margin:0}
.savebar{position:sticky;bottom:0;z-index:3;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;gap:8px}
.savebar .btn{min-height:52px;font-size:16px;flex:1}
.phedit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px;border-radius:14px;border:1px solid var(--line);align-items:start}
.phedit.mine{border:2px solid var(--mine);background:var(--mine-soft)}
.phedit.ref{background:#F7F8FA}
.phedit .pimg{width:96px;height:96px;border-radius:10px;object-fit:cover;background:#fff;display:block}
.phedit .pc{display:flex;flex-direction:column;gap:8px;min-width:0}
.phedit select,.phedit input{border:1px solid #D1D5DE;border-radius:10px;padding:6px 8px;min-height:40px;background:#fff;font-size:14px;width:100%}
.whose{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.whose button{min-height:38px;border-radius:10px;border:1px solid #D1D5DE;background:#fff;font-size:13px;font-weight:800;cursor:pointer}
.whose button.on-mine{background:var(--mine);border-color:var(--mine);color:#fff}
.whose button.on-ref{background:var(--ref);border-color:var(--ref);color:#fff}
.phbtns{display:flex;gap:6px;flex-wrap:wrap}
.nsres{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid #EEF0F5;background:#fff;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.nsres img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none}
.nsres .tx{flex:1;min-width:0}
.nsres b{display:block;font-size:14px;line-height:1.3}
.nsres span{font-size:12px;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:10px}
.step i{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#fff;flex:none}
.step h2{font-size:16px;font-weight:800}

/* albums */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 4px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;padding:2px 0 6px;color:var(--ink);text-align:center;min-width:0}
.slot .face{--face:58px;width:58px;height:58px}
.slot .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.slot .empty-c{width:62px;height:62px;border-radius:50%;border:2px dashed #A5ABB8;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-3)}
.slot .empty-c.want{border:2px solid var(--amber);background:var(--amber-soft);color:var(--amber-ink)}
.slot b{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.slot span{font-size:10.5px;color:var(--ink-3);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{height:10px;border-radius:5px;background:#E6E8F2;overflow:hidden;display:flex}
.prog i{display:block;height:10px}
.alb{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid #EEF0F5;background:#fff;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.alb:last-child{border-bottom:0}
.alb .tx{flex:1;min-width:0}
.alb b{display:block;font-size:15px}
.alb .prog{margin-top:6px;height:6px}

/* lists, menus, misc */
.lst{display:flex;flex-direction:column;gap:8px}
.lst .item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.lst .item>div{flex:1;min-width:0}
.panel{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(17,24,39,.06);min-width:0}
.panel h3{font-size:17px;font-weight:800}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.menu button{text-align:left;background:#fff;border:0;border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(17,24,39,.06);color:var(--ink)}
.menu button .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.menu button b{font-size:16px}
.dbxst{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.dbxst dt{color:var(--ink-3)}.dbxst dd{margin:0;min-width:0;overflow-wrap:anywhere}
code.sel{user-select:all;word-break:break-all;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(70px,30%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:3ch;text-align:right;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:90;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
textarea.csv{width:100%;min-height:160px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.infob{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;border:1.5px solid #818CF8;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:800;cursor:pointer;padding:0;vertical-align:middle;margin-left:4px}
.gtext{font-size:14px;line-height:1.55;color:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.gtext p,.gtext ol,.gtext ul,.gtext dl{margin:0}.gtext ol,.gtext ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.gt{width:100%;border-collapse:collapse;font-size:13px}.gt th,.gt td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid #EEF0F5}.gt th{font-size:12px;color:var(--ink-3)}.gt td:first-child{white-space:nowrap;color:var(--ink)}
.gd{display:grid;grid-template-columns:minmax(90px,32%) minmax(0,1fr);gap:8px 12px}.gd dt{font-weight:800;color:var(--ink)}.gd dd{margin:0}
.grid2>.field{justify-content:flex-end}
.field input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:24px;background:#fff;color:var(--ink);text-align:left;font-size:16px;padding:8px 12px;min-width:0;width:100%}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.field .stepper input{width:64px!important;min-width:64px;flex:none;border:0!important;border-radius:0!important;padding:0!important;min-height:0!important;height:44px}
.stepper{flex:none;width:100%;max-width:180px;justify-content:space-between}
.inrow select{flex:none}
.ckd{display:flex;flex-direction:column;gap:10px}
.sethit{display:block;font-size:11.5px;font-weight:700;color:#047857;line-height:1.3;overflow-wrap:anywhere}
.setb{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:800;background:#E0E7FF;color:#3730A3;white-space:nowrap}
.setbox{display:flex;flex-direction:column;gap:12px;border-top:1px solid #EEF0F5;padding-top:12px}
.setin{display:flex;flex-direction:column;gap:10px}
.sitems{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F5F6FB;border:1px solid var(--line)}
.sitem .tx,.sdet summary .tx,.rcrow .tx,.rcc .tx,.ckrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sitem .tx b,.sdet summary .tx b,.rcrow .tx b,.rcc .tx b,.ckrow .tx b{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.sitem .tx span,.sdet summary .tx span,.rcrow .tx span,.rcc .tx span,.ckrow .tx span{font-size:12px;color:var(--ink-3)}
.siman{padding:12px;border-radius:12px;background:var(--primary-soft)}
.sdet{border:1px solid var(--line);border-radius:12px;background:#fff}
.sdet summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.sdet summary::-webkit-details-marker{display:none}
.sdet summary::after{content:"▾";color:var(--ink-3)}
.sdet[open] summary::after{content:"▴"}
.sdbody{padding:0 12px 6px}
.rcthumb{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:#fff;border:1px solid #C3C8D2;display:flex;align-items:center;justify-content:center}
.rcthumb img{width:100%;height:100%;object-fit:cover}
.rcpdf{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B;font-weight:800;font-size:13px}
.rcitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:10px;border-radius:14px;border:1px solid #99D9CF;background:#F0FBF9;align-items:start}
.rcitem .pc{display:flex;flex-direction:column;gap:8px;min-width:0}
.rcfields{display:flex;flex-direction:column;gap:8px}
.rcfields .inp,.rcfields input{font-size:15px}
.rclist{display:flex;flex-direction:column;gap:8px}
.rcrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid #EEF0F5;background:#fff;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.rclist .rcrow{border:1px solid var(--line);border-radius:12px}
.listbox .rcrow:last-child{border-bottom:0}
.rcc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #EEF0F5}
.rcc:last-child{border-bottom:0}
.cklist{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.ckrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #EEF0F5;cursor:pointer}
.ckrow input{width:22px;height:22px;flex:none;margin:0}
.dlist{display:flex;flex-direction:column;gap:12px}
.drow{display:flex;align-items:center;gap:12px}
.drow .gico{width:40px;height:40px;border-radius:12px;font-size:12px}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.dtop span{font-weight:800}
.dmain .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.dmain .fill{height:100%;border-radius:5px}
.check-inline input:disabled+span{opacity:.5}
.rcc{flex-wrap:wrap}
.rccmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.rcc .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcx{width:40px;min-width:40px;padding:0;font-size:18px}
.rccov{flex-basis:100%;display:flex;align-items:center;gap:8px;padding:2px 0 4px 50px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.mini{display:flex;align-items:center;border:1px solid #D1D5DE;border-radius:10px;overflow:hidden}
.mini button{width:36px;height:34px;border:0;background:var(--surface-2);font-size:18px;font-weight:700;cursor:pointer}
.mini button:disabled{opacity:.35;cursor:default}
.mini b{min-width:30px;text-align:center;font-size:15px}
.phedit{grid-template-columns:72px minmax(0,1fr)}
.phedit .pimg{width:72px;height:72px}
.whose button{white-space:nowrap;padding:0 6px}
.phbtns .btn{white-space:nowrap}
#report{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111!important;padding:0!important}
  body::before{display:none!important}
  body>*:not(#report){display:none!important}
  #report{display:block!important;font:11pt/1.4 var(--f)}
  #report table{width:100%;border-collapse:collapse}
  #report th,#report td{border-bottom:1px solid #ccc;padding:5px 6px;text-align:left;vertical-align:top;font-size:9.5pt}
  #report img{width:46px;height:46px;object-fit:cover;border-radius:50%}
  #report tr{break-inside:avoid}
}
@media (min-width:640px){.tiles{--cols:4}.tiles.s{--cols:6}.tiles.l{--cols:3}}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.chip,.lrow{transition:background .15s,border-color .15s,transform .1s}.tile:active{transform:scale(.97)}}
</style>
</head>
